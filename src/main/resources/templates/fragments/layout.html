<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

    <div th:fragment="sidebar" class="bg-dark text-white" id="sidebar-wrapper">
        <div class="sidebar-heading border-bottom border-secondary p-3">
            <i class="bi bi-mortarboard-fill me-2"></i> SMS Admin
        </div>
        <div class="list-group list-group-flush">
            <a th:href="@{/dashboard}" class="list-group-item list-group-item-action bg-dark text-white border-0">
                <i class="bi bi-speedometer2 me-2"></i> Dashboard
            </a>
            <a th:href="@{/students}" class="list-group-item list-group-item-action bg-dark text-white border-0">
                <i class="bi bi-people me-2"></i> Students
            </a>
            <a th:href="@{/login}" class="list-group-item list-group-item-action bg-dark text-white border-0 border-top border-secondary">
                <i class="bi bi-box-arrow-right me-2"></i> Logout
            </a>
        </div>
    </div>

    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
        <div class="container-fluid">
            <button class="btn btn-outline-secondary" id="sidebarToggle">
                <i class="bi bi-list"></i>
            </button>
            <div class="ms-auto">
                <span class="text-muted"><i class="bi bi-person-circle me-1"></i> Admin</span>
            </div>
        </div>
    </nav>

    <footer th:fragment="footer" class="py-4 bg-light mt-auto border-top">
        <div class="container-fluid px-4 text-center">
            <div class="text-muted">Copyright &copy; Student Management System 2026</div>
        </div>
    </footer>

    <th:block th:fragment="scripts">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            window.addEventListener('DOMContentLoaded', event => {
                const sidebarToggle = document.body.querySelector('#sidebarToggle');
                if (sidebarToggle) {
                    sidebarToggle.addEventListener('click', event => {
                        event.preventDefault();
                        document.body.classList.toggle('sb-sidenav-toggled');
                    });
                }
            });
        </script>
    </th:block>

</body>
</html>
