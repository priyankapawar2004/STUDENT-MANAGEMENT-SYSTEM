<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body>

<div class="d-flex" id="wrapper">

    <!-- Sidebar -->
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <!-- Page Content -->
    <div id="page-content-wrapper">

        <!-- Navbar -->
        <div th:replace="~{fragments/layout :: navbar}"></div>

        <div class="container-fluid px-4 py-4">

            <div class="bg-primary text-white rounded-3 p-4 mb-4">
                <div class="d-flex justify-content-between align-items-center">

                    <div>
                        <h2 class="mb-1">Students Enrolled in Courses</h2>
                        <p class="mb-0 opacity-75">
                            View all student enrollments.
                        </p>
                    </div>

                    <a th:href="@{/enrollments/showEnroll}"
                       class="btn btn-light text-primary fw-semibold">
                        <i class="bi bi-plus-lg me-1"></i>
                        Enroll Student
                    </a>

                </div>
            </div>

            <!-- Success Message -->
            <div class="alert alert-success"
                 th:if="${message}"
                 th:text="${message}">
            </div>

            <div class="card">

                <div class="card-header bg-white">
                    <i class="bi bi-table me-1"></i>
                    Enrolled Students
                </div>

                <div class="card-body">

                    <div class="table-responsive">

                        <table class="table table-bordered table-hover align-middle">

							<thead class="table-light">
							    <tr>
							        <th>#</th>
							        <th>Student Name</th>
							        <th>Email</th>
							        <th>Course Count</th>
							        <th>Total Fee</th>
							        <th>Actions</th>
							    </tr>
							</thead>
                            
							<tbody>

							    <tr th:if="${students == null or students.empty}">
							        <td colspan="6" class="text-center text-muted">
							            No enrollments found.
							        </td>
							    </tr>

							    <tr th:each="student, stat : ${students}">
							        <td th:text="${stat.count}"></td>

							        <td th:text="${student.studentName}"></td>

							        <td th:text="${student.email}"></td>

							        <td th:text="${student.courseCount}"></td>

							        <td th:text="${'Rs. ' + student.totalFee}"></td>

							        <td>
							            <a href="#" class="btn btn-info btn-sm text-white">
							                <i class="bi bi-eye"></i>
							            </a>
							        </td>
							    </tr>

							</tbody>
								</table>

								</div>

								</div>

								</div>

								</div>

								</div>

								</div>

								<div th:replace="~{fragments/layout :: scripts}"></div>

								<script>
								window.addEventListener('DOMContentLoaded', event => {

								    const sidebarToggle = document.body.querySelector('#sidebarToggle');

								    if (sidebarToggle) {

								        sidebarToggle.addEventListener('click', event => {

								            event.preventDefault();
								            document.body.classList.toggle('sb-sidenav-toggled');

								        });

								    }

								});
								</script>

								</body>
								</html>
