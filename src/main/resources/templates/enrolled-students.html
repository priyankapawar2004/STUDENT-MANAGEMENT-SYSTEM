<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body>

<div class="d-flex" id="wrapper">

    <!-- Sidebar -->
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <!-- Page Content -->
    <div id="page-content-wrapper">

        <!-- Navbar -->
        <div th:replace="~{fragments/layout :: navbar}"></div>

        <div class="container-fluid px-4 py-4">

            <div class="bg-primary text-white rounded-3 p-4 mb-4">
                <div class="d-flex justify-content-between align-items-center">

                    <div>
                        <h2 class="mb-1">Students Enrolled in Courses</h2>
                        <p class="mb-0 opacity-75">
                            View all student enrollments.
                        </p>
                    </div>

                    <a th:href="@{/enrollments/showEnroll}"
                       class="btn btn-light text-primary fw-semibold">
                        <i class="bi bi-plus-lg me-1"></i>
                        Enroll Student
                    </a>

                </div>
            </div>

            <!-- Success Message -->
            <div class="alert alert-success"
                 th:if="${message}"
                 th:text="${message}">
            </div>

            <div class="card">

                <div class="card-header bg-white">
                    <i class="bi bi-table me-1"></i>
                    Enrolled Students
                </div>

                <div class="card-body">

                    <div class="table-responsive">

                        <table class="table table-bordered table-hover align-middle">

                            <thead class="table-light">

                            <tr>

                                <th>#</th>

                                <th>Student Name</th>

                                <th>Email</th>

                                <th>Course Name</th>

                                <th>Course Fee</th>

                                <th>Enrollment Date</th>

                            </tr>

                            </thead>

                            <tbody>
								
								
								
								
								<tr th:if="${#lists.isEmpty(enrollments)}">
								    <td colspan="6" class="text-center text-muted">
								        No enrollments found.
								    </td>
								</tr>

								<tr th:each="enrollment, stat : ${enrollments}">

								    <td th:text="${stat.count}"></td>

								    <td th:text="${enrollment.student.firstName + ' ' + enrollment.student.lastName}"></td>

								    <td th:text="${enrollment.student.email}"></td>

								    <td th:text="${enrollment.course.courseName}"></td>

								    <td th:text="${'Rs. ' + enrollment.course.fee}"></td>

								    <td th:text="${#temporals.format(enrollment.enrolledDate,'dd-MM-yyyy HH:mm')}"></td>

								</tr>

								</tbody>

								</table>

								</div>

								</div>

								</div>

								</div>

								</div>

								</div>

								<div th:replace="~{fragments/layout :: scripts}"></div>

								<script>
								window.addEventListener('DOMContentLoaded', event => {

								    const sidebarToggle = document.body.querySelector('#sidebarToggle');

								    if (sidebarToggle) {

								        sidebarToggle.addEventListener('click', event => {

								            event.preventDefault();
								            document.body.classList.toggle('sb-sidenav-toggled');

								        });

								    }

								});
								</script>

								</body>
								</html>
