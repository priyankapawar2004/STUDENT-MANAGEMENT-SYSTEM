<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>

<body>
    <div class="d-flex" id="wrapper">
        <div th:replace="~{fragments/layout :: sidebar}"></div>

        <div id="page-content-wrapper">
            <div th:replace="~{fragments/layout :: navbar}"></div>

            <div class="container-fluid px-4 py-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Courses</h2>
                    <a th:href="@{/course/new}" class="btn btn-primary">
                        <i class="bi bi-plus-lg me-1"></i> Add New Course
                    </a>
                </div>
                
                <div th:if="${message}" class="alert alert-success text-center" role="alert" th:text="${message}"></div>

                <div class="card mb-4">
                    <div class="card-header bg-white">
                        <i class="bi bi-table me-1"></i> Course List
                    </div>
                    <div class="card-body">
						<div class="text-muted" th:if= "${courses.isEmpty()}">No course found</div>
                        <div class="table-responsive" th:if= "${!courses.isEmpty()}">
                            <table class="table table-hover table-striped">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Course Name</th>
                                        <th>Course Code</th>
                                        <th>Course Fees</th>
                                        <th>Duration</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="course : ${courses}">
                                        <td data-label="ID"            th:text="${course.id}"></td>
                                        <td  data-label="course name"  th:text="${course.courseName}"></td>
                                        <td  data-label="course code"  th:text="${course.courseCode}"></td>
                                        <td  data-label="course fee"   th:text="${course.fee}"></td>
                                        <td  data-label="duration"     th:text="${course.duration}"></td>
                                        <td>
                                            <a th:href="@{/course/view/{id}(id=${course.id})}" class="btn btn-sm btn-info text-white me-1">
                                                <i class="bi bi-eye"></i>
                                            </a>
                                            <a th:href="@{/course/edit/{id}(id=${course.id})}" class="btn btn-sm btn-warning text-white me-1">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                        </td>
                                    </tr>
                                    
                                    <tr th:if="${courses.isEmpty()}">
                                        <td colspan="6" class="text-center py-4 text-muted">
                                            No courses found in database. Click "Add New Course" to get started.
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <nav aria-label="Course pagination" th:if="${!courses.isEmpty()}">
                            <ul class="pagination justify-content-end mt-3">
								
								<li class="page-item" th:classappend="${courses.first} ? 'disabled'">
								    <a class="page-link" th:href="@{/course/list(page=${courses.number - 1})}">Previous</a>
								</li>
								
								<li class="page-item active">
								    <a class="page-link" th:text="${courses.number + 1}">1</a>
								</li>
								
								<li class="page-item" th:classappend="${courses.last} ? 'disabled'">
								    <a class="page-link" th:href="@{/course/list(page=${courses.number + 1})}">Next</a>
								</li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
